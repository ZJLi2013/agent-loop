name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -e "tools/pager[dev]"
      - run: python -m pytest tools/pager/tests -q
      - run: python -m compileall -q harness adapters tools/pager/pager
      - run: git diff --check

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync and uninstall in an isolated profile
        shell: powershell
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "agent-loop-home"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.cursor" | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/sync-to-cursor.ps1
          if (-not (Test-Path "$env:USERPROFILE\.cursor\rules\agent-loop.mdc")) { throw "rules link missing" }
          if (-not (Test-Path "$env:USERPROFILE\.cursor\harness\run.py")) { throw "harness link missing" }
          if (-not (Test-Path "$env:USERPROFILE\.cursor\skills-cursor\work-planning\SKILL.md")) { throw "skill link missing" }
          powershell -ExecutionPolicy Bypass -File scripts/uninstall-from-cursor.ps1
          if (Test-Path "$env:USERPROFILE\.cursor\rules") { throw "rules link survived uninstall" }
          if (Test-Path "$env:USERPROFILE\.cursor\harness") { throw "harness link survived uninstall" }
          $hooks = Get-Content "$env:USERPROFILE\.cursor\hooks.json" -Raw
          if ($hooks -match "memory-lookup|harness-stop|goal-refresh") { throw "hook entry survived uninstall" }

