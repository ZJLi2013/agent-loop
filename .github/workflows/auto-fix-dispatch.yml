name: auto-fix-dispatch

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  dispatch:
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Start the auto-fix Automation
        env:
          URL: ${{ secrets.CURSOR_AUTOFIX_WEBHOOK_URL }}
          TOKEN: ${{ secrets.CURSOR_AUTOFIX_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          LINK: ${{ github.event.issue.html_url }}
        # Issue fields reach the shell only through env: a title is untrusted input.
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --argjson number "$NUMBER" --arg title "$TITLE" --arg url "$LINK" \
            '{repository: $repo, issue_number: $number, title: $title, url: $url}' |
            curl --fail-with-body -sS -X POST "$URL" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
