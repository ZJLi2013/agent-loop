name: Bug report
description: Report a reproducible agent-loop defect
title: "[bug] "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private prompts, transcripts, hostnames, and unpublished data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    attributes:
      label: Which public guarantee does it maintain?
      description: "The three guarantees are listed in [design.md](https://github.com/ZJLi2013/agent-loop/blob/main/design.md#范围)."
      options:
        - "1. Declared task lifecycle: admission, execution, verification, review, pause, stop, handoff, record retirement"
        - "2. Installation, wiring and compatibility on supported hosts"
        - "3. This repository's release, contribution, security and defect reporting"
        - "None of these (likely out of scope)"
    validations:
      required: true
  - type: input
    attributes:
      label: Commit or release
      placeholder: "1e7da88 or v0.1.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: OS, host/version, Python version, and shell
      placeholder: "Windows 11; Cursor 3.x or Codex CLI 1.x; Python 3.13; PowerShell 5.1"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Layer
      options:
        - Installer
        - Kernel / Harness
        - Policy / Skill
        - Platform Adapter
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps, command, and sanitized input
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected boundary
      description: What should have continued, paused, verified, or stopped?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual result and evidence
      description: Sanitized output, exit code, and relevant state fields
    validations:
      required: true

