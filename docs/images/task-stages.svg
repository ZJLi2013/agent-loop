<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1400" height="600" rx="18" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">一个 task 的生命周期</text>
  <rect x="1150" y="22" width="34" height="20" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1192" y="37" font-size="13" fill="#475569">可选</text>
  <rect x="1240" y="22" width="56" height="20" rx="10" fill="#e2e8f0"/>
  <text x="1268" y="36" font-size="11" fill="#334155" text-anchor="middle" font-family="Consolas,Menlo,monospace">phase</text>
  <text x="1304" y="37" font-size="13" fill="#475569">status 显示</text>

  <!-- lanes -->
  <rect x="20" y="60" width="1360" height="120" rx="14" fill="#fff7ed"/>
  <rect x="20" y="190" width="1360" height="160" rx="14" fill="#eff6ff"/>
  <rect x="20" y="360" width="1360" height="120" rx="14" fill="#f5f3ff"/>
  <text x="36" y="116" font-size="16" font-weight="700" fill="#c2410c">human</text>
  <text x="36" y="138" font-size="12" fill="#9a3412">定方向</text>
  <text x="36" y="266" font-size="16" font-weight="700" fill="#1d4ed8">worker</text>
  <text x="36" y="288" font-size="12" fill="#1e40af">调 agent-loop-</text>
  <text x="36" y="304" font-size="12" fill="#1e40af">harness</text>
  <text x="36" y="416" font-size="16" font-weight="700" fill="#6d28d9">reviewer</text>
  <text x="36" y="438" font-size="12" fill="#5b21b6">独立模型</text>

  <!-- arrows: main path -->
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-gray)">
    <path d="M208 316 V420 H298"/>
    <path d="M368 378 V120 H458"/>
    <path d="M528 162 V274 H618"/>
    <path d="M756 274 H788"/>
    <path d="M926 274 H958"/>
    <path d="M1096 274 H1178 V376"/>
  </g>
  <!-- loops -->
  <path d="M1028 232 C1028 214 858 214 858 230" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  <text x="943" y="210" font-size="12" fill="#dc2626" text-anchor="middle">failed：修好再验</text>
  <path d="M1178 462 V515 H858 V318" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
  <text x="1018" y="508" font-size="13" fill="#ea580c" text-anchor="middle">revise：同一 task 补完再验证（最多一次）</text>
  <path d="M1210 462 V552 H688 V318" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="950" y="574" font-size="13" fill="#16a34a" text-anchor="middle">continue：已批准的下一个 task，重新 init</text>
  <path d="M1222 376 V147" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
  <text x="1230" y="210" font-size="12" fill="#7c3aed">ask_human</text>
  <path d="M1246 420 H1268" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-gray)"/>
  <path d="M208 147 V230" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>

  <!-- human lane -->
  <g filter="url(#shadow)">
    <rect x="140" y="95" width="136" height="50" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="460" y="78" width="136" height="84" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <rect x="1110" y="95" width="136" height="50" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  </g>
  <text x="208" y="117" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">改 Goal / 范围</text>
  <text x="208" y="136" font-size="12" fill="#0f172a" text-anchor="middle" font-family="Consolas,Menlo,monospace">pause</text>
  <text x="528" y="106" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">③ 批准</text>
  <text x="528" y="130" font-size="13" fill="#475569" text-anchor="middle">plan 与 task</text>
  <rect x="473" y="140" width="110" height="18" rx="9" fill="#ffedd5"/>
  <text x="528" y="153" font-size="11" fill="#9a3412" text-anchor="middle" font-family="Consolas,Menlo,monospace">approved · doing</text>
  <text x="1178" y="117" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">回答 reviewer</text>
  <text x="1178" y="136" font-size="12" fill="#475569" text-anchor="middle">方向要 human 定</text>

  <!-- worker lane -->
  <g filter="url(#shadow)">
    <rect x="140" y="232" width="136" height="84" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="620" y="232" width="136" height="84" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="790" y="232" width="136" height="84" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="960" y="232" width="136" height="84" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="208" y="260" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">① 写计划</text>
  <text x="208" y="284" font-size="13" fill="#475569" text-anchor="middle">plan + task.md</text>
  <rect x="173" y="294" width="70" height="18" rx="9" fill="#dbeafe"/>
  <text x="208" y="307" font-size="11" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,Menlo,monospace">proposed</text>

  <text x="688" y="260" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">④ 锁定判据</text>
  <rect x="664" y="270" width="48" height="20" rx="6" fill="#f1f5f9"/>
  <text x="688" y="285" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Consolas,Menlo,monospace">init</text>
  <rect x="663" y="294" width="50" height="18" rx="9" fill="#dbeafe"/>
  <text x="688" y="307" font-size="11" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,Menlo,monospace">ready</text>

  <text x="858" y="260" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">⑤ 执行</text>
  <rect x="832" y="270" width="52" height="20" rx="6" fill="#f1f5f9"/>
  <text x="858" y="285" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Consolas,Menlo,monospace">exec</text>
  <rect x="827" y="294" width="62" height="18" rx="9" fill="#dbeafe"/>
  <text x="858" y="307" font-size="11" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,Menlo,monospace">running</text>

  <text x="1028" y="260" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">⑥ 验证</text>
  <rect x="996" y="270" width="64" height="20" rx="6" fill="#f1f5f9"/>
  <text x="1028" y="285" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Consolas,Menlo,monospace">verify</text>
  <rect x="995" y="294" width="66" height="18" rx="9" fill="#dbeafe"/>
  <text x="1028" y="307" font-size="11" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,Menlo,monospace">verified</text>

  <!-- reviewer lane -->
  <g filter="url(#shadow)">
    <rect x="300" y="378" width="136" height="84" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="1110" y="378" width="136" height="84" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <rect x="1270" y="400" width="96" height="40" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="368" y="406" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">② 计划评审</text>
  <rect x="320" y="416" width="96" height="20" rx="6" fill="#f1f5f9"/>
  <text x="368" y="431" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Consolas,Menlo,monospace">plan-review</text>
  <rect x="338" y="440" width="60" height="18" rx="9" fill="#ede9fe"/>
  <text x="368" y="453" font-size="11" fill="#5b21b6" text-anchor="middle">只给建议</text>

  <text x="1178" y="406" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">⑦ 评审</text>
  <text x="1178" y="430" font-size="13" fill="#475569" text-anchor="middle">选下一步</text>
  <rect x="1140" y="440" width="76" height="18" rx="9" fill="#ede9fe"/>
  <text x="1178" y="453" font-size="11" fill="#5b21b6" text-anchor="middle">决策后归档</text>

  <text x="1318" y="425" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas,Menlo,monospace">stop</text>
</svg>
